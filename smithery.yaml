# Smithery configuration for Tiflux
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_tiflux

name: tiflux-mcp
displayName: "Tiflux"
description: >
  Wrapper da API oficial v2 do Tiflux (help desk e service desk): chamados com respostas ao solicitante, notas internas, anexos, histórico de estágios e SLAs, apontamentos de horas, clientes e solicitantes, mesas com estágios, prioridades e catálogo de serviços, base de conhecimento, contratos e relatórios de faturamento e satisfação. Consulta e operação. Autenticação por token de Sessão API do usuário.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/tiflux-mcp
repository: https://github.com/mcp-dir/tiflux-mcp

tags:
  - tiflux
  - brazil
  - support
  - horizontal
  - read-write

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_tiflux

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_tiflux/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
